<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coinfield Expo | Official Access</title>
<meta name="description" content="Gain official access to Coinfield Expo and view the event program.">
<meta name="author" content="Coinfield Expo">
<link rel="icon" href="favicon.ico">

<style>
  :root {
    --primary: #2563eb;
    --gradient: linear-gradient(135deg,#3b82f6,#1d4ed8);
    --bg-dark: #020617;
    --bg-soft: rgba(2,6,23,0.85);
    --text-light: #e5e7eb;
    --text-muted: #94a3b8;
    --shadow: rgba(0,0,0,0.65);
    --transition: 0.5s ease-in-out;
  }

  * { box-sizing: border-box; margin:0; padding:0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617 70%);
    color: var(--text-light);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main { width:100%; max-width:700px; padding:20px; }

  .card {
    background: var(--bg-soft);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 50px 40px;
    box-shadow: 0 40px 80px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.03);
    animation: rise 1s cubic-bezier(0.16,1,0.3,1) forwards;
    position: relative;
    overflow: hidden;
  }

  h1 { text-align:center; font-size:32px; margin-bottom:14px; font-weight:600; }
  p { text-align:center; font-size:16px; line-height:1.65; color: var(--text-muted); margin-bottom:36px; max-width:500px; margin-left:auto;margin-right:auto; }

  form { animation: fade 1.5s ease forwards; }
  input {
    width:100%; padding:18px 16px; margin-bottom:20px;
    border-radius:10px; border:1px solid rgba(255,255,255,0.08);
    background: var(--bg-dark); color: var(--text-light); font-size:16px; outline:none;
    transition:border 0.25s ease;
  }
  input:focus { border-color: var(--primary); }

  button {
    width:100%; padding:18px; border:none; border-radius:10px;
    background: var(--gradient); color:white; font-weight:600; cursor:pointer;
    font-size:16px; transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover { transform:translateY(-1px); box-shadow:0 18px 35px rgba(37,99,235,0.45); }

  section { display:none; opacity:0; transition:opacity var(--transition); }

  .active { display:block; opacity:1; }

  .program img, iframe {
    width:100%; border-radius:14px; box-shadow:0 30px 60px rgba(0,0,0,0.7); margin-top:26px;
  }

  /* Confirmation overlay */
  .overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.8);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    color:white; font-size:22px; text-align:center;
    border-radius:20px; opacity:0; pointer-events:none;
    transition:opacity 0.5s ease;
    z-index:10;
    padding:20px;
  }
  .overlay.show { opacity:1; pointer-events:auto; }

  @keyframes rise { from{opacity:0;transform:translateY(28px) scale(0.98);} to{opacity:1;transform:translateY(0) scale(1);} }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }

  @media(max-width:700px){ .card{padding:40px 30px;} h1{font-size:28px;} }
</style>
</head>
<body>

<main>
  <div class="card">

    <!-- ACCESS -->
    <section id="access" class="active">
      <h1>Welcome to Coinfield Expo</h1>
      <p>Please enter your email to gain official access to the program and location.</p>
      <form id="emailForm">
        <input type="email" name="email" placeholder="Email address" required>
        <button type="submit">Continue</button>
      </form>
    </section>

    <!-- CONFIRMATION OVERLAY -->
    <div id="overlay" class="overlay">
      <p>Thank you! Your email has been submitted successfully.</p>
    </div>

    <!-- PROGRAM -->
    <section id="program" class="program">
      <h1>Order of Event</h1>
      <img src="./order-of-event.jpg" alt="Coinfield Expo Program">
    </section>

    <!-- MAP -->
    <section id="map" class="program">
      <h1>Event Location</h1>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.123456789!2d-122.4194156846812!3d37.77492927975959!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c12345678%3A0xabcdef1234567890!2sEvent+Venue!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
        allowfullscreen="" loading="lazy"></iframe>
    </section>

  </div>
</main>

<script>
const form = document.getElementById("emailForm");
const access = document.getElementById("access");
const overlay = document.getElementById("overlay");
const program = document.getElementById("program");
const map = document.getElementById("map");

form.addEventListener("submit", e => {
  e.preventDefault();
  const email = form.email.value.trim();
  if(!email) return;

  const WEB_APP_URL = "YOUR_WEB_APP_URL_HERE"; // Replace with your Apps Script Web App

  // Submit email to Google Sheets
  fetch(WEB_APP_URL, {
    method: "POST",
    body: new URLSearchParams({ email })
  })
  .then(res => res.text())
  .then(() => {
    overlay.classList.add("show");
    setTimeout(() => {
      overlay.classList.remove("show");
      access.classList.remove("active");
      program.classList.add("active");
      map.classList.add("active");
    }, 2000);
  })
  .catch(err => {
    console.error(err);
    alert("Error submitting email. Please try again.");
  });
});
</script>

</body>
</html>
